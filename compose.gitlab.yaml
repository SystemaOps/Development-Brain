# Optional GitLab overlay (Phase 38).
# Enable with:  docker compose -f compose.yaml -f compose.gitlab.yaml up -d
# GitLab provides the merge-request runtime: verified code creates MRs and
# merge events flow back into Brain knowledge.  The Brain works with the fake
# PR adapter (offline) or any GitLab-compatible API without changes.
services:
  gitlab:
    image: gitlab/gitlab-ce:17.4.4-ce.0
    container_name: brain-gitlab
    hostname: gitlab
    ports:
      - "8929:80"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://localhost:8929'
        gitlab_rails['initial_root_password'] = 'brain-secret-password'
    volumes:
      - brain-gitlab-config:/etc/gitlab
      - brain-gitlab-logs:/var/log/gitlab
      - brain-gitlab-data:/var/opt/gitlab
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/-/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10

  brain-api:
    environment: &gitlab-env
      BRAIN_PULL_REQUEST_PROVIDER: gitlab
      BRAIN_PULL_REQUEST_GITLAB_URL: http://gitlab:80
      BRAIN_PULL_REQUEST_GITLAB_API_KEY: brain-gitlab-token
      BRAIN_AUTOMATION_AUTO_CREATE_PR: "true"

  brain-worker:
    environment: *gitlab-env

  brain-scheduler:
    environment: *gitlab-env

volumes:
  brain-gitlab-config:
  brain-gitlab-logs:
  brain-gitlab-data: