# Software Development Brain — core runtime (Phase 32).
# Starts the Brain platform: API, worker, scheduler, migration, and the core
# storage services (PostgreSQL, Neo4j, Weaviate, Redis, MinIO).
#   docker compose up -d
# Migration model: a one-shot brain-migrate service runs `alembic upgrade head`
# once; API/worker/scheduler start only after it completes successfully, so
# replicas never race migrations.
services:
  brain-migrate:
    image: brain:latest
    container_name: brain-migrate
    environment: &brain-env
      BRAIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/brain
      BRAIN_NEO4J_URI: bolt://neo4j:7687
      BRAIN_NEO4J_USER: neo4j
      BRAIN_NEO4J_PASSWORD: password
      BRAIN_WEAVIATE_HOST: weaviate
      BRAIN_WEAVIATE_PORT: "8080"
      BRAIN_WEAVIATE_GRPC_PORT: "50051"
      BRAIN_REDIS_URL: redis://redis:6379/0
      BRAIN_REDIS_PROVIDER: redis
      BRAIN_ARTIFACTS_PROVIDER: local
    command: ["python", "-m", "brain.bootstrap.migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  brain-api:
    image: brain:latest
    container_name: brain-api
    environment:
      <<: *brain-env
      BRAIN_API_HOST: 0.0.0.0
      BRAIN_API_PORT: "8000"
    ports:
      - "8000:8000"
    command: ["brain-api"]
    depends_on:
      brain-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  brain-worker:
    image: brain:latest
    container_name: brain-worker
    environment:
      <<: *brain-env
    command: ["brain-worker"]
    depends_on:
      brain-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  brain-scheduler:
    image: brain:latest
    container_name: brain-scheduler
    environment:
      <<: *brain-env
      BRAIN_SCHEDULER_INTERVAL: "60"
    command: ["brain-scheduler"]
    depends_on:
      brain-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: brain-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: brain
    ports:
      - "5432:5432"
    volumes:
      - brain-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d brain"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: brain-neo4j
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7687:7687"
      - "7474:7474"
    volumes:
      - brain-neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  weaviate:
    image: semitechnologies/weaviate:1.29.1
    container_name: brain-weaviate
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: "/var/lib/weaviate"
      DEFAULT_VECTORIZER_MODULE: "none"
      ENABLE_MODULES: ""
      CLUSTER_HOSTNAME: "node1"
    ports:
      - "8080:8080"
      - "50051:50051"
    volumes:
      - brain-weaviatedata:/var/lib/weaviate
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/v1/.well-known/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    container_name: brain-redis
    ports:
      - "6379:6379"
    volumes:
      - brain-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: brain-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: brain
      MINIO_ROOT_PASSWORD: brain-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - brain-miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  brain-pgdata:
  brain-neo4jdata:
  brain-weaviatedata:
  brain-redisdata:
  brain-miniodata:


