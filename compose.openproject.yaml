# Optional OpenProject overlay (Phase 34).
# Enable with:  docker compose -f compose.yaml -f compose.openproject.yaml up -d
# Work-management integration: the Brain syncs/triggers from OpenProject tasks
# assigned to the Brain actor, and projects observations back as comments.
services:
  openproject:
    image: openproject/openproject:16
    container_name: brain-openproject
    ports:
      - "8081:8080"
    environment:
      OPENPROJECT_HTTPS: "false"
      OPENPROJECT_HOST_NAME: localhost:8081
      OPENPROJECT_RAILS__RELATIVE_URL_ROOT: ""
      OPENPROJECT_SECRET_KEY_BASE: change-me
      OPENPROJECT_DEFAULT__LANGUAGE: en
      OPENPROJECT_AUTH__SOURCE__SSO: ""
    volumes:
      - brain-openprojectdata:/var/openproject/assets

  brain-api:
    environment: &openproject-env
      BRAIN_WORK_MANAGEMENT_ENABLED: "true"
      BRAIN_WORK_MANAGEMENT_PROVIDER: openproject
      BRAIN_WORK_MANAGEMENT_BASE_URL: http://openproject:8080
      BRAIN_WORK_MANAGEMENT_API_KEY: ${OPENPROJECT_API_KEY:-}
      BRAIN_WORK_MANAGEMENT_PROJECT_ID: ${OPENPROJECT_PROJECT_ID:-}
      BRAIN_WORK_MANAGEMENT_BRAIN_ACTOR_ID: ${OPENPROJECT_BRAIN_ACTOR_ID:-}
      BRAIN_WORK_MANAGEMENT_REQUIRED: "false"

  brain-worker:
    environment: *openproject-env

  brain-scheduler:
    environment: *openproject-env

volumes:
  brain-openprojectdata: